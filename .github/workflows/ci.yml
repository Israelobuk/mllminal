name: CI

on:
  push:
    branches: [main, "Israelobuk/mllminal-foundation"]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  package_acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build Windows installer
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File packaging/windows/build-installer.ps1
      - name: Run packaged Windows acceptance
        shell: pwsh
        env:
          MLLMINAL_WINDOWS_ACCEPTANCE: "1"
          MLLMINAL_SETUP_EXE: "${{ github.workspace }}\\packaging\\windows\\dist\\MLLminal-Setup.exe"
          MLLMINAL_ACCEPTANCE_TIMINGS_PATH: "${{ github.workspace }}\\packaging\\windows\\dist\\MLLminal-acceptance-timings.json"
        run: uv run pytest tests/acceptance/test_windows_one_click_install.py -q
      - name: Record measured package audit
        if: always()
        shell: pwsh
        run: |
          $timingsPath = "packaging/windows/dist/MLLminal-acceptance-timings.json"
          $reportPath = "packaging/windows/dist/MLLminal-package-audit.json"
          if (-not (Test-Path -LiteralPath $timingsPath) -or -not (Test-Path -LiteralPath $reportPath)) {
            Write-Warning "Acceptance timing evidence was not produced."
            exit 0
          }
          $timings = Get-Content -LiteralPath $timingsPath -Raw | ConvertFrom-Json
          $existing = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $before = [int64]$existing.installer_before_bytes
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/package-audit.ps1 `
            -DistributionDirectory packaging/windows/dist `
            -RuntimeDirectory packaging/windows/runtime `
            -ReportPath $reportPath `
            -BeforeSetupBytes $before `
            -ColdInstallSeconds ([double]$timings.cold_install_seconds) `
            -FirstLaunchSeconds ([double]$timings.first_launch_seconds) `
            -DaemonReadySeconds ([double]$timings.daemon_ready_seconds)
          if ($LASTEXITCODE -ne 0) { throw "Measured package audit failed." }
      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mllminal-windows-installer
          path: |
            packaging/windows/dist/MLLminal-Setup.exe
            packaging/windows/dist/MLLminal-package-audit.json
            packaging/windows/dist/MLLminal-acceptance-timings.json
          if-no-files-found: warn
